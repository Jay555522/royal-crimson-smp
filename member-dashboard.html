
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Crimson SMP - Member Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #160d12;
      color: white;
      text-align: center;
    }
    header {
      background: #8b102d;
      padding: 30px 15px;
    }
    h1 { margin: 0; }
    main {
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
    }
    .panel {
      background: #2b1922;
      padding: 25px;
      margin: 20px 0;
      border-radius: 12px;
    }
    a {
      color: #ffb6c8;
      margin: 10px;
    }
    button {
      background: #b51d43;
      color: white;
      border: 0;
      padding: 12px 24px;
      border-radius: 7px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>👑 Royal Crimson SMP</h1>
    <p>Official Member Dashboard</p>
  </header>
<div class="panel">
  <h2>📢 Official Announcements</h2>
  <div id="announcements-list">
    <p>Loading announcements...</p>
  </div>
</div>
  <main>
    <div class="panel">
      <h2>Welcome, Member!</h2>
      <p id="member-email">Loading account...</p>
    </div>

    <div class="panel">
      <h2>Kingdoms</h2>
      <p>Explore the kingdoms of Royal Crimson SMP.</p>
      <a href="reigm-empire.html">Reigm Empire</a>
      <a href="zephyrial-empire.html">Zephyrial Empire</a>
      <a href="endoria.html">Endoria</a>
    </div>



    <button id="logout-button">Sign Out</button>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-auth.js"></script>

  <script>
    auth.onAuthStateChanged(function(user) {
      if (user) {
        document.getElementById("member-email").textContent = user.email;
      } else {
        window.location.href = "member-login.html";
      }
    });

    document.getElementById("logout-button").addEventListener("click", function() {
      auth.signOut().then(function() {
        window.location.href = "member-login.html";
      });
    });
    // Load official announcements
const announcementsList = document.getElementById("announcements-list");

firebase.firestore().collection("announcements")
  .orderBy("createdAt", "desc")
  .get()
  .then(function(snapshot) {
    announcementsList.innerHTML = "";

    if (snapshot.empty) {
      announcementsList.textContent = "No announcements yet.";
      return;
    }

    snapshot.forEach(function(doc) {
      const announcement = doc.data();

      const item = document.createElement("div");
      const title = document.createElement("h3");
      const message = document.createElement("p");

      title.textContent = announcement.title || "Announcement";
      message.textContent = announcement.message || "";

      item.appendChild(title);
      item.appendChild(message);
      announcementsList.appendChild(item);
    });
  })
  .catch(function(error) {
    console.error("Announcement loading error:", error);
    announcementsList.textContent = "Unable to load announcements.";
  });
  </script>
</body>
</html>
